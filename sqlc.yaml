# sqlc 配置：migrations/ 是 schema 真相源（原生识别 goose 注解），
# queries 就近放在 repository 层旁边。
# 生成代码入库；`make sqlc-verify` 负责校验漂移。
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/queries
    gen:
      go:
        package: sqlcdb
        out: internal/repository/sqlcdb
        sql_package: pgx/v5
        overrides:
          # pgx/v5 默认映射成 pgtype.Timestamp[tz]；对 NOT NULL 列直接用
          # 原生 time.Time 能让 model 映射更简单。
          - db_type: pg_catalog.timestamp
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
