name: security

# 安全扫描跟 ci.yml 解耦：CVE 数据库 / gosec 升级会让原本通过的代码突然失败，
# 把它绑进 PR 必跑会让常规迭代体验抖动。这里走定时 + 手动触发；扫到问题
# 通过 issue / Slack 通知，不阻塞合并。

on:
  schedule:
    # 每周一 04:00 UTC（≈ 北京时间周一中午）。频率高点便于早发现 CVE。
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true

      # 缓存 make init / make sec 装到 ~/go/bin 的工具二进制（setup-go 只缓存
      # GOMODCACHE / GOCACHE）。key 带 Go 版本：旧 Go 编译的分析工具处理不了新
      # 版本代码；工具版本变了 Makefile 的 _ensure-* 会自动重装，restore-keys 安全。
      - name: Cache tool binaries
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('Makefile') }}
          restore-keys: ${{ runner.os }}-gobin-${{ steps.setup-go.outputs.go-version }}-

      - name: make sec (govulncheck + gosec)
        run: make sec
