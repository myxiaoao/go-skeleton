apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-skeleton-worker
  labels:
    app.kubernetes.io/name: go-skeleton
    app.kubernetes.io/component: worker
spec:
  # Worker 不接外部流量，没有 readiness 摘流的概念，只看队列堆积。副本数
  # 由 KEDA / 自定义 metrics-based HPA 调（基于 asynq_queue_pending）。
  # 静态 1 副本起步，按业务量手工调或接 KEDA。
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-skeleton
      app.kubernetes.io/component: worker
  strategy:
    # 滚动升级：Asynq 两阶段停服（Stop + Shutdown）+ shutdown 期间不拉新任务、
    # 现有任务跑完。maxSurge=0 是为了避免老 Worker 还在跑时新 Worker 多消费
    # 抢任务——单副本场景没区别，多副本时这条更安全。
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-skeleton
        app.kubernetes.io/component: worker
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: go-skeleton-worker:REPLACE-TAG
          imagePullPolicy: IfNotPresent
          args: []
          # Worker 可观测端口（WORKER_METRICS_ADDR，默认 :9091）：/metrics 给
          # Prometheus（PodMonitor，见 servicemonitor.yaml）、/livez 给 liveness、
          # /health 给 readiness。Worker 不接业务流量，所以不建 Service。
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          envFrom:
            - configMapRef:
                name: go-skeleton-env
            - secretRef:
                name: go-skeleton-secrets
          # 显式 env 覆盖 envFrom：把可观测端口绑到 Pod IP（私网地址），而不是
          # 0.0.0.0——APP_ENV=production 下 config.WorkerProductionWarnings 对
          # 监听全部网卡会打 warn。kubelet 探针与 Prometheus 都走 Pod IP，不受影响。
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: WORKER_METRICS_ADDR
              value: "$(POD_IP):9091"
          # liveness 打 /livez（恒 200，不碰依赖）：Redis 抖动时重启 worker
          # 救不回 Redis，反而打断在跑的任务。
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readiness 打 /health（Redis 必查、配了 DB 时查 DB，失败 503）。worker
          # 没有 Service 可摘流，readiness 主要给滚动升级判断新 Pod 是否就绪。
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # 给两阶段优雅停足够时间：Stop 等当前批拉的任务跑完。长任务业务调更长。
      # 必须 >= max(Asynq Server.ShutdownTimeout, 业务任务最长执行时间) +
      # 一点缓冲，否则 K8s 会 SIGKILL 截断正在跑的任务。
      terminationGracePeriodSeconds: 60
